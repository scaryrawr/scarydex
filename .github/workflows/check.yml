name: Validate marketplace
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - run: git diff --exit-code -- plugins/omlx-media/scripts/media.mjs plugins/omlx-media/bundle-manifest.json plugins/pstack/skills/poteto-mode/scripts/orch/orch.mjs plugins/pstack/skills/poteto-mode/scripts/watch-pr/watch-pr.mjs plugins/pstack/bundle-manifest.json
